# render.yaml — TK Studio (Webstudio fork) — reference service spec.
# Deploys the @webstudio-is/builder Remix app as a single Render Web Service.
#
# NOTE: the live service `tk-studio-va` (srv-d88bjm67r5hc73fgb9g0, Virginia)
# was created directly via the Render API, not from this Blueprint. This file
# is kept as the canonical record of build/start commands + env var shape.
# If re-applying as a Blueprint, Render will create a new service.
#
# Postgres is NOT defined here — TK Studio uses an EXTERNAL managed Postgres
# (Supabase, AWS us-east-2). Supabase also provides PostgREST, which Webstudio
# requires. All connection strings + secrets are entered as env vars in the
# Render dashboard (sync: false keys below). NO SECRETS LIVE IN THIS FILE.

services:
  - type: web
    name: tk-studio-va
    runtime: node
    plan: starter
    # Virginia (us-east-1) — adjacent to the Supabase DB in AWS us-east-2,
    # and consistent with the other TK Technology Render services.
    region: virginia
    branch: main
    autoDeploy: true

    # Monorepo: install + build from the repo root so pnpm workspace resolves.
    # corepack activates the pinned pnpm (9.14.4) declared in package.json.
    #
    # --prod=false is REQUIRED: NODE_ENV=production (set below) makes pnpm skip
    # devDependencies, but Webstudio keeps its build tooling (prisma, esbuild,
    # vite, typescript) in devDependencies. Without this flag the build fails
    # with `prisma: not found`. Runtime NODE_ENV=production is unaffected.
    #
    # `pnpm build` (root script: `pnpm -r --filter='!./fixtures/*' build`)
    # builds ALL workspace packages in topological order. Building only the
    # builder app fails — its ~40 internal deps (e.g. @webstudio-is/http-client)
    # resolve `import` to a `lib/` dir that doesn't exist until they're built.
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter=@webstudio-is/prisma-client generate &&
      pnpm build

    # Custom server (apps/builder/server.mjs) instead of `remix-serve`: it
    # adds `trust proxy` so request.url is https:// behind Render/Cloudflare.
    # Stock remix-serve reports http://, which breaks the builder OAuth flow.
    # The server honors $PORT (Render injects it automatically).
    startCommand: node apps/builder/server.mjs

    # Health check hits /robots.txt — a static file served directly by
    # the server (200, no route loader). The app root `/` cannot be used:
    # Webstudio's preventCrossOriginCookie guard 403s any request without
    # sec-fetch-* headers, which Render's health checker (Render/1.0) omits.
    healthCheckPath: /robots.txt

    envVars:
      # --- Runtime pins ---------------------------------------------------
      # Pin Node 22 to avoid the Node-24 esbuild version mismatch
      # ("Expected 0.x but got 0.y") that bit the GrapesJS deploy.
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production

      # --- Database (Supabase) -------------------------------------------
      # DATABASE_URL  -> Supabase POOLED connection (pgbouncer, port 6543).
      #                  Used by the running app for normal queries.
      # DIRECT_URL    -> Supabase DIRECT connection (port 5432).
      #                  Used by Prisma for migrations (no pgbouncer).
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false

      # --- Auth -----------------------------------------------------------
      # AUTH_SECRET: 32+ char random string. Generate with:
      #   openssl rand -hex 32
      - key: AUTH_SECRET
        sync: false
      # DEV_LOGIN must NOT be set in prod (its absence disables dev login).
      # GitHub OAuth App credentials:
      - key: GH_CLIENT_ID
        sync: false
      - key: GH_CLIENT_SECRET
        sync: false

      # --- PostgREST (Supabase) ------------------------------------------
      # POSTGREST_URL: the Supabase project REST endpoint
      #   https://<project-ref>.supabase.co/rest/v1
      # POSTGREST_API_KEY: the Supabase `anon` API key (a signed JWT).
      - key: POSTGREST_URL
        sync: false
      - key: POSTGREST_API_KEY
        sync: false

      # --- Asset storage (Cloudflare R2, S3-compatible) ------------------
      # Reuse the existing tk-studio-assets R2 bucket from the GrapesJS work.
      - key: S3_BUCKET
        value: tk-studio-assets
      - key: S3_REGION
        value: auto
      - key: S3_ACL
        value: public-read
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Cloudflare R2 public worker URL for serving assets.
      - key: ASSET_CDN_URL
        sync: false

      # --- Feature flags / plans -----------------------------------------
      # Mirrors apps/builder/.env. * enables all features.
      - key: FEATURE_FLAGS
        value: "*"

      # --- Publisher (Phase 5 — leave unset for now) ---------------------
      # PUBLISHER_HOST / PUBLISHER_ENDPOINT / PUBLISHER_TOKEN deferred.
