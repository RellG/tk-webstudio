# render.yaml — TK Studio (Webstudio fork) Blueprint
# Deploys the @webstudio-is/builder Remix app as a single Render Web Service.
#
# Apply this Blueprint from the Render dashboard:
#   New + > Blueprint > connect RellG/tk-webstudio > select branch `main`.
# Render reads this file and provisions the service below.
#
# Postgres is NOT defined here — TK Studio uses an EXTERNAL managed Postgres
# (Supabase). Supabase also provides PostgREST, which Webstudio requires.
# All connection strings + secrets are entered as env vars in the Render
# dashboard (sync: false keys below). NO SECRETS LIVE IN THIS FILE.

services:
  - type: web
    name: tk-studio
    runtime: node
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true

    # Monorepo: install + build from the repo root so pnpm workspace resolves,
    # then the Builder app is built via the root `build` script chain.
    # corepack activates the pinned pnpm (9.14.4) declared in package.json.
    #
    # --prod=false is REQUIRED: NODE_ENV=production (set below) makes pnpm skip
    # devDependencies, but Webstudio keeps its build tooling (prisma, esbuild,
    # vite, typescript) in devDependencies. Without this flag the build fails
    # with `prisma: not found`. Runtime NODE_ENV=production is unaffected.
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter=@webstudio-is/prisma-client generate &&
      pnpm --filter=@webstudio-is/builder build

    # remix-serve honors $PORT (Render injects it automatically).
    startCommand: pnpm --filter=@webstudio-is/builder start

    # Webstudio Builder serves a 200 at the app root once booted.
    healthCheckPath: /

    envVars:
      # --- Runtime pins ---------------------------------------------------
      # Pin Node 22 to avoid the Node-24 esbuild version mismatch
      # ("Expected 0.x but got 0.y") that bit the GrapesJS deploy.
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production

      # --- Database (Supabase) -------------------------------------------
      # DATABASE_URL  -> Supabase POOLED connection (pgbouncer, port 6543).
      #                  Used by the running app for normal queries.
      # DIRECT_URL    -> Supabase DIRECT connection (port 5432).
      #                  Used by Prisma for migrations (no pgbouncer).
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false

      # --- Auth -----------------------------------------------------------
      # AUTH_SECRET: 32+ char random string. Generate with:
      #   openssl rand -hex 32
      - key: AUTH_SECRET
        sync: false
      # DEV_LOGIN must NOT be set in prod (its absence disables dev login).
      # GitHub OAuth App credentials:
      - key: GH_CLIENT_ID
        sync: false
      - key: GH_CLIENT_SECRET
        sync: false

      # --- PostgREST (Supabase) ------------------------------------------
      # POSTGREST_URL: the Supabase project REST endpoint
      #   https://<project-ref>.supabase.co/rest/v1
      # POSTGREST_API_KEY: the Supabase `anon` API key (a signed JWT).
      - key: POSTGREST_URL
        sync: false
      - key: POSTGREST_API_KEY
        sync: false

      # --- Asset storage (Cloudflare R2, S3-compatible) ------------------
      # Reuse the existing tk-studio-assets R2 bucket from the GrapesJS work.
      - key: S3_BUCKET
        value: tk-studio-assets
      - key: S3_REGION
        value: auto
      - key: S3_ACL
        value: public-read
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Cloudflare R2 public worker URL for serving assets.
      - key: ASSET_CDN_URL
        sync: false

      # --- Feature flags / plans -----------------------------------------
      # Mirrors apps/builder/.env. * enables all features.
      - key: FEATURE_FLAGS
        value: "*"

      # --- Publisher (Phase 5 — leave unset for now) ---------------------
      # PUBLISHER_HOST / PUBLISHER_ENDPOINT / PUBLISHER_TOKEN deferred.
